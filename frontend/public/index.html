        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#A0291C" />

        <!--
          Google Search Console — domain verification.
          Set REACT_APP_GSC_TOKEN in the Vercel project env vars once the
          Search Console property is created (Property → HTML tag method).
          If unset, the meta tag renders empty and Google silently ignores it.
          Also mirrored on all SSR endpoints (/api/story/*, /api/og/*) so
          Google can verify off any indexable URL, not just index.html.
        -->
        <meta name="google-site-verification" content="%REACT_APP_GSC_TOKEN%" />

        <meta name="description" content="India's sports business publication. Reportage, analysis and intelligence from sport's most consequential rooms, written for the people who run the game." />

        <!-- Open Graph / Facebook / WhatsApp -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://www.stateofplay.club/" />
        <meta property="og:title" content="The State of Play | Sports Business Intelligence" />
        <meta property="og:description" content="India's sports business publication. Reportage, analysis and intelligence from sport's most consequential rooms, written for the people who run the game." />
        <meta property="og:image" content="https://www.stateofplay.club/og-default.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:site_name" content="The State of Play" />

        <!--
          Locked font stack (see /app/design_guidelines.json):
            Gloock             → display (H1/H2 headlines) — single weight, no italic
            Literata           → reading (article body + deks)
            Schibsted Grotesk → UI / label / byline
          Prior versions loaded 11+ additional families (Inter, Playfair, IBM Plex,
          Source Serif 4, Spectral, Geist, Geist Mono) — culled 2026-08-25 as they
          were referenced only as CSS fallback strings but never rendered. Fraunces,
          Newsreader and DM Sans were replaced 2026-08-26 for a warmer, more
          editorial pairing; Gloock swapped in for Literata on display duty
          2026-08-26 for a more distinctive headline face.
        -->
        <!-- Gloock is served from the site itself (public/fonts): when Google
             Fonts did not load it, headlines fell back to Georgia. Declared
             here, not in src/index.css, because the build would try to bundle
             a /fonts/ path written there. One weight, no italic. -->
        <link rel="preload" href="/fonts/Gloock.woff2" as="font" type="font/woff2" crossorigin />
        <style>@font-face{font-family:'Gloock';src:url('/fonts/Gloock.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}</style>
